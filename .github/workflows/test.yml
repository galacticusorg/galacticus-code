name: 'test'
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # No `npm ci`: the extension has no dependencies, and the suite runs on
      # node's built-in test runner with a stubbed `vscode` module.
      - name: Run tests
        run: npm test
